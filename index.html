                    '<H1 class="turca centro">Metodología</H1><p class="justificado">En nuestra <b>“Accademia italiana online"</b> se adopta un enfoque humanista-afectivo en la enseñanza de lenguas pone en el centro el aprendizaje de la persona, valorando sus emociones, su personalidad y sus experiencias. Nacido a raíz de la psicología humanista de Carl Rogers, considera al estudiante como un todo, con el objetivo de crear un clima relajado en el aula para reducir las barreras psicológicas, filtros afectivos que dificultan el aprendizaje.</p>' +
                    '<p class="justificado">Nuestro enfoque va poniendo en lugar central al estudiante. La empatía será el lazo más fuerte para crear un vínculo de confianza. Un desempeño de gran compromiso y responsabilidad. A continuación los invitamos a leer nuestros objetivos primarios.</p>' +
                    '<br><div><h2>Objetivos Generales: </h2><ul><li>Aprendizaje de la Lengua e Cultura Italiana;</li><li>Intercambio intercultural;</li><li>Espacio de participación y colaboración.</li></ul></div>' +
                    '<br><div><h2>Objetivos Específicos:</h2><ul><li>Aprendizaje de los contenidos gramaticales, lexicales y fonéticos;</li><li>Desarrollo de las actividades cognitivas;</li><li>Desarrollo de las habilidades de comprensión de la lectura;</li><li>Desarrollo de las habilidades de producción escrita;</li><li>Expresión oral - Dramatización.</li></ul></div><br>' +
                    '<h1 class="turca centro">Procedimientos:</h1><p class="justificado">A partir del momento que el estudiante se inscribe en un curso de italiano, comienza a participar en las lecciones virtuales. Los cursos pueden ofrecer sea lecciones grupales sea lecciones individuales. Algunos cursos se presentan regulares, otros con una frecuencia intensiva. Sin embargo, la propuesta es siempre llegar a un objetivo y alcanzar una meta.</p>' +
                    '<p class="justificado">Los cursos se realizan a través de la plataforma Zoom con una duración de 120 minutos por clase. Las clases vienen grabadas con el objetivo de monitorear y mejorar la calidad de la enseñanza. Por este motivo, aquellos (estudiantes incluídos en clases grupales) que por cualquier motivo debieran entrar en las reuniones más tarde, retirarse antes o bien debieran ausentarse non perderán ningún contenido. <b><i><u>Quedó todo registrado en la grabación que todos los participantes de los cursos</u></i></b> recibirán a través de la dirección de correo electrónico institucional.</p>' +
                    '<p class="justificado">Las clases vienen monitoreadas para controlar el seguimiento de los cursos, de los cuales surgen diversos controles. En primer lugar, <b><i>Control de Asistencia</i></b> a la clase y en segundo lugar, <b><i>Control de pagos.</i></b> En el <b><i>Control de Asistencia</i></b> se verifica la participación de los estudiantes y los contenidos desarrollados, mientras que en el <b><i>Control de pagos</i></b> se cargan los recibos de las transferencias bancarias. A este punto, se solicita a los estudiantes que envien los recibos indicando el mes / la clase al cual hace referencia a nuestra casilla de correo institucional.</p>' +
                    '<br><h2>Dirección Académica</h2><p class="justificado">Desde la Dirección Académica se imparten las nuevas disposiciones, se trabaja para el mejoramiento continuo de la <b><i>"Accademia italiana online"</i></b> ofreciendo cursos de alta calidad y excelencia. Además, la Dirección Académica está abierta al diálogo, escucha las necesidades y exigencias de sus alumnos. Por tal motivo, se realizan sondeos y encuestas de valoración a nuestros estudiantes para compartir sus experiencias al interno de nuestra estructura pedagógica.</p>' +
                    '<br><h2>Administración</h2><p class="justificado">La Administración de la <b><i>"Accademia italiana online"</i></b> comprende el sector administrativo y el sector contable. En el área administrativa se reciben y procesan las solicitudes de los estudiantes que llegan al correo institucional. Además, nuestra administración cuenta con su propio correo electrónico, a través del cual se comunican las novedades oficiales. En el área contable se realizan diversos controles, entre ellos:<p class="justificado">' +
                    '<div><ul><li>Control di asistencia a clase (Tomar lista de la clase);</li><li>Control de pagos de los cursos (Carga de los recibos en el sistema operativo);</li><li>Monitoreo de las grabaciones, en modo tal de regular el seguimiento de los cursos.</li></ul></div>' +
                    '<h2>Aula virtual</h2><p class="justificado">El Aula virtual se desarrolla a través de la plataforma Zoom, donde las lecciones vienen grabadas para optimizar la calidad de la enseñanza, del aprendizaje y finalmente de la evaluación. Las reuniones se realizan en 120 minutos, para los cursos grupales o de 60 minutos para los individuales según el curso requerido.</p>' +
                    '<h2>Informática-Diseño gráfico:</h2><p class="justificado">Nuestro colaborador el señor <b><i>Dario Bellon</i></b>, presta soporte y asistencia en el área informática. Ha contribuido sea en la creación del sito web sea en la conformación de la <b><i>“Mega Biblioteca Virtual"</i></b> a disposición para los estudiantes.</p><br><br><br>',
            cursos: '<img alt="CURSOS" width="100%" srcset="Cursos-s.jpg 300w, Cursos-m.jpg 600w, Cursos-l.jpg 1200w, Cursos-xl.jpg 2000w" sizes="70vmin"><h1 class="centro">Cursos: regulares e intensivos</h1><br>' +
                    '<section class="papa"><div class="cabeza">&nbsp;<u class="titulo">Nivel inicial: A1</u><br></div><div class="tapa-libro"><img src="Domani 1.jpg" class="tLibro" width="15px"><br>Domani 1</div><div class="textoD"><strong class="tituloCursos">A1 - Principiante (Nivel de Descubrimiento)</strong><br>En el nivel A1 del QCER, el estudiante de idiomas:<div class="listing"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de comprender y usar expresiones b&aacute;sicas necesarias para satisfacer necesidades concretas e inmediatas.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de presentarse a otras personas, hacer y responder preguntas personales, como d&oacute;nde vive, a qui&eacute;n conoce y qu&eacute; posee.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;&nbsp;<small>es capaz de interactuar solo si la otra persona habla despacio y con claridad.</small></div></div></div><div class="PdP">» <span class="sub-azul"><small><u>Prueba el curso de italiano de nivel A1:</u> Consulta disponibilidad.</small></span></div></section><br><hr><br>' +
                    '<section class="papa"><div class="cabeza">&nbsp;<u class="titulo">Nivel preintermedio: A2</u><br></div><div class="tapa-libro"><img src="Domani 2.jpg" class="tLibro" width="15px"><br>Domani 2</div><div class="textoD"><strong class="tituloCursos">A2 - Elemental (Nivel de supervivencia)</strong><br>En el nivel A2 del QCER, el estudiante de idiomas:<div class="listing"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de comprender frases y expresiones de uso com&uacute;n relacionadas con &aacute;reas generales como la familia, el trabajo o las compras.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de comunicarse en actividades sencillas y rutinarias que requieren un intercambio simple de informaci&oacute;n sobre temas como la familia o el uso com&uacute;n.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>Puede describir en t&eacute;rminos sencillos aspectos de su entorno, su entorno inmediato y sus necesidades inmediatas.</small></div></div></div><div class="PdP">» <span class="sub-azul"><small><u>Prueba el curso de italiano de nivel A2:</u> Preguntar por disponibilidad.</small></span></div></section><br><hr><br>' +
                    '<section class="papa"><div class="cabeza">&nbsp;<u class="titulo">Nivel Intermedio: B1</u><br></div><div class="tapa-libro"><img src="Domani 3.jpg" class="tLibro" width="15px"><br>Domani 3</div><div class="textoD"><strong class="tituloCursos">B1 - Independiente (Nivel Umbral)</strong><br>En el nivel B1 del QCER, el estudiante de italiano:<div class="listing"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>Puede comprender los puntos principales de textos claros sobre temas familiares que se encuentran habitualmente en el trabajo, la escuela o el ocio.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>Puede desenvolverse en situaciones que probablemente surjan al viajar a zonas donde se habla el idioma.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>Puede producir discursos sencillos y coherentes sobre temas familiares o de interés personal.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>Puede describir experiencias y acontecimientos, esperanzas y ambiciones, así como opiniones o planes a corto plazo.</small></div></div></div><div class="PdP">» <span class="sub-azul"><small><u>Prueba el curso de italiano de nivel B1:</u> Preguntar por disponibilidad.</small></span></div></section><br><hr><br>' +
                    '<section style="width: 90%; margin: auto;">&nbsp; <u class="titulo">Curso de Consolidaci&oacute;n y Conversaci&oacute;n: Nivel B1 para Adultos</u><br><br>&nbsp;&nbsp;Tras alcanzar el nivel B1, el estudiante de idiomas:<div style="margin: 10px 0 10px 20px;"><div class="itemLI">&nbsp;<img src="Punto10.png" class="puntoLI">&nbsp;&nbsp;<small>puede consolidar sus conocimientos gramaticales.</small></div><div class="itemLI">&nbsp;<img src="Punto10.png" class="puntoLI">&nbsp;&nbsp;<small>puede mejorar sus habilidades comunicativas.</small></div><div class="itemLI">&nbsp;<img src="Punto10.png" class="puntoLI">&nbsp;&nbsp;<small>es capaz de producir diversos tipos de discurso, incluyendo expresiones profesionales.</small></div><div class="itemLI">&nbsp;<img src="Punto10.png" class="puntoLI">&nbsp;&nbsp;<small>es capaz de percibir diferencias en contextos concretos o abstractos.</small></div><div>» <span class="sub-azul"><small><u>Prueba el Curso de Consolidaci&oacute;n y Conversaci&oacute;n de Nivel B1:</u> Consulta disponibilidad.</small></span></div></div></section><br><hr><br>' +
                    '<section class="papa"><div class="cabeza">&nbsp;<u class="titulo">Curso de preparaci&oacute;n para la certificaci&oacute;n: Nivel B1 Adultos</u><br></div><div class="tapa-libro"><img src="Nuovo Esame B1.jpg" class="tLibro" width="15px"><br>Quaderno PLIDA B1</div><div class="textoD"><br>Tras alcanzar el nivel B1, el estudiante de idiomas:<div class="listing"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>pueden validar sus conocimientos del nivel intermedio B1 mediante la certificaci&oacute;n PLIDA, en la sede de la Asociaci&oacute;n Dante Alighieri.</small></div><div class="itemLI"><br>Los centros de certificaci&oacute;n PLIDA se encuentran en todo el mundo; visite <a href="http://www.plida.it" target="_blank">www.plida.it</a><br><br><br></div></div></div><div class="PdP">» <span class="sub-azul"><small><u>Pruebe el curso de preparaci&oacute;n para la certificaci&oacute;n de nivel B1:</u> Consulte la disponibilidad.</small></span></div></section><br><hr><br>' +
                    '<section class="papa-cuadro"><div class="titulo"><strong><i>&nbsp;&nbsp;La Certificaci&oacute;n PLIDA permite a los estudiantes:&nbsp;&nbsp;</i></strong></div><div style="padding: 0 20px 10px 30px;"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;&nbsp;<small>Solicitar "Permesso di soggiorno in Italia" (desde el nivel A2);</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>Solicitar "Permesso di lungo soggiorno in Italia", sea un permiso de estad&iacute;a con el prop&oacute;sito de establecerse en el pa&iacute;s (desde el nivel A2); &nbsp; &nbsp; </small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;&nbsp;<small>Inscribirse en las Universidades para realizar carreras universitarias (el nivel solicitado varia en base a los ateneos y al tipo de facultad);  &nbsp; </small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;&nbsp;<small>Solicitar visto de ingreso por razones de estudio;</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;&nbsp;<small>Postularse en empresas para trabajar en relaci&oacute;n de dependencia.;</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;&nbsp;<small>Adem&aacute;s, se podr&aacute; solicitar Ciudadan&iacute;a italiana. </small></div></div></section><br><hr><br>' +
                    '<section class="papa"><div class="cabeza">&nbsp;<u class="titulo">Nivel Intermedio Alto: B2 Adultos</u><br></div><div class="tapa-libro"><img src="Nuovo Magari B2.jpg" class="tLibro" width="15px"><br>Nuovo Magari B2</div><div class="textoD"><strong class="tituloCursos">B2 - Intermedio Alto (Nivel Independiente)</strong><br>En el nivel B2 del QCER, el estudiante de idiomas:<div class="listing"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de comprender los puntos clave de discursos complejos sobre temas concretos y abstractos, incluyendo argumentos t&eacute;cnicos en su campo de especializaci&oacute;n.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de interactuar con fluidez y espontaneidad, lo que facilita la conversaci&oacute;n con hablantes nativos.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de producir textos claros y detallados sobre una amplia gama de temas y explicar un punto de vista sobre un tema, considerando las ventajas y desventajas de diversas opciones.</small></div></div></div><div class="PdP">» <span class="sub-azul"><small><u>Prueba el curso de italiano de nivel B2:</u> Consulta disponibilidad.</small></span></div></section><br><hr><br>' +
                    '<section class="papa"><div class="cabeza">&nbsp;<u class="titulo">Nivel Avanzado: C1 Adultos</u><br></div><div class="tapa-libro"><img src="Nuovo Magari C12.jpg" class="tLibro" width="15px"><br>Nuovo Magari C1/C2</div><div class="textoD"><strong class="tituloCursos">C1 - Avanzado (Nivel Independiente)</strong><br>En el nivel C1 del QCER, el estudiante de italiano:<div class="listing"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de comprender oraciones m&aacute;s largas y complejas, y reconocer significados impl&iacute;citos.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de expresar ideas con fluidez y espontaneidad, sin pensar demasiado en c&oacute;mo expresarlas.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de usar el idioma de forma flexible y concreta para fines sociales, acad&eacute;micos y profesionales.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de producir textos claros, bien estructurados y detallados sobre temas complejos, demostrando el uso correcto de la organizaci&oacute;n, la articulaci&oacute;n y la cohesi&oacute;n textual.</small></div></div></div><div class="PdP">» <span class="sub-azul"><small>Prueba el curso de italiano de nivel C1:</u> Pr&oacute;ximamente.</small></span></div></section><br><hr><br>' +
                    '<section class="papa"><div class="cabeza">&nbsp;<u class="titulo">Nivel experto: C2 Adultos</u><br></div><div class="tapa-libro"><img src="Nuovo Magari C12.jpg" class="tLibro" width="15px"><br>Nuovo Magari C1/C2</div><div class="textoD"><strong class="tituloCursos">C2 - Experto (Nivel de dominio)</strong><br>En el nivel C2 del QCER, el estudiante de italiano:<div class="listing"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de comprender f&aacute;cilmente todo lo que escucha o lee.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de sintetizar informaci&oacute;n de diferentes fuentes, tanto escritas como orales, reconstruyendo el argumento de forma coherente.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de expresarse de forma espont&aacute;nea, fluida y precisa, distinguiendo diferencias de significado incluso en las situaciones m&aacute;s complejas.</small></div></div></div><div class="PdP">» <span class="sub-azul"><small><u>Prueba el curso de italiano de nivel C2:</u> Pr&oacute;ximamente.</small></span></div></section><br><hr><br>' +
                    '<section class="papa"><div class="cabeza">&nbsp;<u class="titulo">Nivel inicial: A1 Juniors para adolescentes de 13 a 17 a&ntilde;os.</u><br></div><div class="tapa-libro"><img src="ParlaConMe 1.jpg" class="tLibro" width="15px"><br>Parla con me 1</div><div class="textoD"><strong class="tituloCursos">H&aacute;blame 1 (Nivel A1)</strong><br>El estudiante de idiomas:<div class="listing"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de comprender y usar expresiones b&aacute;sicas para satisfacer necesidades concretas e inmediatas.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de presentarse a otras personas, haciendo y respondiendo preguntas personales, como d&oacute;nde vive, a qui&eacute;n conoce y qu&eacute; posee.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de interactuar solo si la otra persona habla despacio y con claridad.</small></div></div></div><div class="PdP">» <span class="sub-azul"><small><u>Prueba el curso de Nivel A1 para j&oacute;venes:</u> Pr&oacute;ximamente.</small></span></div></section><br><hr><br>' +
                    '<section class="papa"><div class="cabeza">&nbsp;<u class="titulo">Nivel preintermedio: A2 Juniors (ni&ntilde;os de 13 a 17 a&ntilde;os).</u><br></div><div class="tapa-libro"><img src="ParlaConMe 2.jpg" class="tLibro" width="15px"><br>Parla con me 2</div><div class="textoD"><strong class="tituloCursos">H&aacute;blame 2 (Nivel A2)</strong><br>El estudiante de idiomas:<div class="listing"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de comprender oraciones y expresiones comunes relacionadas con &aacute;reas generales como la familia, la escuela o las compras.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de comunicarse en tareas sencillas y rutinarias que requieren un intercambio simple de informaci&oacute;n sobre temas como la familia o lo cotidiano.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>es capaz de describir en t&eacute;rminos sencillos aspectos de su vida, su entorno inmediato y sus necesidades inmediatas.</small></div></div></div><div class="PdP">» <span class="sub-azul"><small><u>Prueba el curso de Nivel A2 para j&oacute;venes:</u> Pr&oacute;ximamente.</small></span></div></section><br><hr><br>' +
                    '<section class="papa"><div class="cabeza">&nbsp;<u class="titulo">Nivel intermedio: B1 Juniors (ni&ntilde;os de 13 a 17 a&ntilde;os).</u><br></div><div class="tapa-libro"><img src="ParlaConMe 3.jpg" class="tLibro" width="15px"><br>Parla con me 3</div><div class="textoD"><strong class="tituloCursos">H&aacute;blame 3 (Nivel  B1)</strong><br>El estudiante de idiomas:<div class="listing"><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>puede comprender los puntos principales de una conversaci&oacute;n clara sobre temas cotidianos que se encuentran habitualmente en el comedor, en el colegio o durante el tiempo libre.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>puede desenvolverse en situaciones que probablemente surjan al viajar a zonas donde se habla el idioma.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>puede producir una conversaci&oacute;n sencilla y coherente sobre temas conocidos o de inter&eacute;s personal.</small></div><div class="itemLI"><img src="Punto10.png" class="puntoLI">&nbsp;<small>puede describir experiencias y acontecimientos, esperanzas y ambiciones, as&iacute; como opiniones y planes a corto plazo.</small></div></div></div><div class="PdP">» <span class="sub-azul"><small><u>Prueba el curso de Nivel B1 para j&oacute;venes:</u> Pr&oacute;ximamente.</small></span></div></section><br><br><br>',

                    '<h2 class="centro">Benvenuti</h2>' +
                    '<div class="bloque"><p>Scopri la lingua della letteratura, l’arte e la passione. Nella nostra <b><i>"Accademia Italiana Online"</i></b> ti invitiamo a immergersi nell’italiano di una forma autentica, dinamica e completamente pratica, ideale tanto per chi comincia da zero come da chi desidera migliorare il suo livello accademico.</p>' +
                    '<p>Imparare l’italiano non è solo imparare una lingua, è molto altro ancora assai profondo: ci apre le porte alla storia di Roma, all’incantesima città di Firenze, alla magia di Venezia e ad una delle gastronomie più riconosciute del mondo. Il nostro approccio umanistico/affettivo della glottodidattica combina Lingua e Cultura italiane sin dal primo giorno.</p>' +
                    '<p>All’interno del nostro <u class="sub-azul">Piano di studio</u> si prevedono corsi specializzati, conformati da piccoli gruppi e lezioni ideate per avanzare in modo rapido ed efficace. Inoltre, la modalità online si aggiusta meglio ai bisogni o agli obiettivi dei nostri studenti.</p>' +
                    '<p>I corsi sono adatti a coloro che vogliono viaggiare, studiare in Italia o semplicemente godersi la lingua, questo è lo spazio per iniziare il vostro percorso. Vi condividiamo materiale autentico, in fine vi diamo la corretta preparazione all’accreditamento a seconda il livello richiesto per le <u class="sub-azul">Certificazioni internazionali</u> (QCER).</p></div><br>' +
                    '<div class="caja-inicio"><u class="sub-azul">Livelli QCER</u><br><span class="sub-azul">Quadro comune europeo di riferimento per la conoscenza delle lingue.</span></div><br>' +
                    '<div class="bloque"><p>In Europa, nella comunità dell’apprendimento della lingua, spesso ascoltiamo le persone parlare del proprio livello linguistico. Ad esempio: “parlo francese con un livello B1” o “sto frequentando un corso di lingua inglese, sono in una classe di livello A2 di grammatica e conversazione”.</p></div><br>' +
                    '<div class="container"><img id="cQCER" src="CQpc-it.jpg" alt="Cuadro QCER" width=60vw><h2 class="tituloQCER">Cosa significa B1 o A2&quest;</h2><p class="cuadroQCER">Questi titoli sono i livelli di competenza linguistica nel sistema del <b>Quadro comune europeo di riferimento per la conoscenza delle lingue</b>, abbreviato in italiano <b>QCER</b>, e sono usati dagli studenti per misurare il proprio livello di conoscenza di una determinata lingua. QCER è una linea guida che viene utilizzata per descrivere i traguardi raggiunti da chi studia una lingua straniera in tutta Europa e sempre più in altri Paesi.</p></div><br><br>' +
                    '<h2>Quali sono i vari livelli QCER&quest;</h2>' +
                    '<div class="bloque"><p class="justificado">I sei livelli all’interno di QCER sono <b>A1</b>, <b>A2</b>, <b>B1</b>, <b>B2</b>, <b>C1</b>, y <b>C2</b>. Questi sei livelli di riferimento sono ampiamente riconosciuti dagli standard europei per valutare le competenze individuali in quaranta lingue differenti. Ogni livello è diviso in quattro tipi di competenze (abilità linguistiche) che descrivono cosa uno studente dovrebbe essere in grado di fare per quanto riguarda la <b>lettura</b>, l’<b>ascolto</b>, la <b>conversazione</b> e la <b>scrittura</b>.</p></div><br>' +
                    '<div class="caja-inicio"><h2>Vi aspettiamo nella nostra <i>"Accademia Italiana Online"</i> per scoprire insieme un nuovo mondo, ricco di sentimenti ed emozioni che avvolgono i cuori di tutti quanti!</h2></div><br><br><br>',

function cargar(sec) {
    if (sec === "area" && !usuario) {
        abrirLogin();
        return;
    }
    document.getElementById("contenido").innerHTML = textos[idioma].contenido[sec];

function cambiarIdioma(l) {
    idioma = l;
    localStorage.setItem("idioma", idioma);
    renderMenu();
    cargar("inicio");
}

function abrirLogin() {
    document.getElementById("loginModal").classList.add("show");
}

function cerrarLogin(e) {
    if (!e || e.target.id === "loginModal") {
        document.getElementById("loginModal").classList.remove("show");
    }
}

function login() {
    const u = user.value;
    const p = pass.value;

    if (u === "alumno" && p === "1234") {
        localStorage.setItem("usuario", u);
        usuario = u;
        cerrarLogin();
        init();
        cargar("area");
    } else {
        error.innerText = "Credenciales incorrectas";
    }
}

function logout() {
    localStorage.removeItem("usuario");
    usuario = null;
    init();
    cargar("inicio");
}

function init() {
    document.getElementById("langSelect").value = idioma;
    document.getElementById("authBtn").innerHTML = usuario
        ? `<div class="logout-btn" onclick="logout()">${textos[idioma].logout}</div>`
        : `<div class="login-btn" onclick="abrirLogin()">${textos[idioma].login}</div>`;
    renderMenu();
}

        ul.innerHTML += `<li onclick="cargar('${secciones[i]}')">${txt}</li>`;

}
