es: {

    /*menu: ["Inicio", "Cursos", "Casos Exitosos", "Quiénes Somos", "Contáctenos", "Área Alumnos"],*/
    contenido: {
        inicio: '<div class="slider"><div class="slides"><div class="slide"><img alt="banner Italia 1" srcset="Italia-1-s.jpg 300w, Italia-1-m.jpg 600w, Italia-1-l.jpg 1200w, Italia-1-xl.jpg 2000w" sizes="70vmin"></div><div class="slide"><img alt="banner Italia 2" srcset="Italia-2-s.jpg 300w, Italia-2-m.jpg 600w, Italia-2-l.jpg 1200w, Italia-2-xl.jpg 2000w" sizes="70vmin"></div><div class="slide"><img alt="banner Italia 3" srcset="Italia-3-s.jpg 300w, Italia-3-m.jpg 600w, Italia-3-l.jpg 1200w, Italia-3-xl.jpg 2000w" sizes="70vmin"></div><div class="slide"><img alt="banner Italia 4" srcset="Italia-4-s.jpg 300w, Italia-4-m.jpg 600w, Italia-4-l.jpg 1200w, Italia-4-xl.jpg 2000w" sizes="70vmin"></div><div class="slide"><img alt="banner Italia 5" srcset="Italia-5-s.jpg 300w, Italia-5-m.jpg 600w, Italia-5-l.jpg 1200w, Italia-5-xl.jpg 2000w" sizes="70vmin"></div><div class="slide"><img alt="banner Italia 6" srcset="Italia-6-s.jpg 300w, Italia-6-m.jpg 600w, Italia-6-l.jpg 1200w, Italia-6-xl.jpg 2000w" sizes="70vmin"></div></div></div>' +
            '<h1 class="titulo-scc">Bienvenidos</h1>' +
            '<div class="bloque"><p class="p1erLinea">Descubr&iacute; la lengua de la literatura, el arte y la pasi&oacute;n. En la <b><i class="turca">“Accademia Italiana Online”</i></b> te invitamos a sumergirte en el italiano de una forma aut&eacute;ntica, din&aacute;mica y completamente pr&aacute;ctica, ideal tanto para quienes empiezan desde cero como para quienes desean perfeccionar su nivel.</p><p>Aprender italiano es mucho m&aacute;s que estudiar un idioma: es abrir la puerta a la historia de Roma, al encanto de Florencia, a la magia de Venecia y a una de las gastronom&iacute;as m&aacute;s reconocidas del mundo. Nuestro enfoque humanista/afectivo de la glotodid&aacute;ctica combina <i>Lengua y Cultura italiana</i> desde el primer d&iacute;a.</p>' +
            '<p>Contamos con cursos especializados, grupos reducidos y clases dise&ntilde;adas para que avances de manera r&aacute;pida y efectiva. Adem&aacute;s, ofrecemos la modalidad online para poder adaptarnos mejor a tus tiempos y objetivos.</p><p>Ya sea que quieras viajar, estudiar en Italia o simplemente disfrutar del idioma, este es el lugar para comenzar tu camino. Te compartimos material exclusivo y te brindamos la correcta preparaci&oacute;n por nivel para las <u class="turca">Certificaciones internacionales</u> (MCER).</p></div><br>' +
            '<div class="cartel"><span style="color: aqua; max-width: 750px;"><span class="turca">&nbsp;<u>MCER:</u> Marco com&uacute;n europeo de referencia para el conocimiento de los idiomas.</span></div><br>' +
            '<div class="bloque"><p>En Europa, en la comunidad del aprendizaje de las lenguas, a menudo escuchamos las personas hablar del propio nivel ling&uuml;&iacute;stico. Por ejemplo: "hablo franc&eacute;s con un nivel B1" o "estoy frecuentando un curso de ingl&eacute;s, estoy en una clase de nivel A2 de gram&aacute;tica y conversaci&oacute;n".</p></div><br>' +
            '<div class="centra-container"><div class="container"><img id="cQCER" src="CQpc-es.jpg" alt="Cuadro QCER" width=60vw><div class="diezPX"></div><h2 class="tituloQCER">&iquest;Qu&eacute; significa B1 o A2&quest;</h2><p class="cuadroQCER">Estos t&iacute;tulos son los niveles de competencia ling&uuml;&iacute;stica en el sistema del <b>Marco com&uacute;n europeo de referencia para el conocimiento de las lenguas</b>, abreviado en italiano <b>QCER</b>, y son usados por los estudiantes para medir el propio nivel de conocimiento de una determinada lengua. MCER es una l&iacute;nea-gu&iacute;a que viene usada para describir los objetivos alcanzados por quien estudia una lengua extranjera en toda Europa y siempre m&aacute;s en otros pa&iacute;ses.</p>' +
            '<h2 class="tituloQCER">&iquest;Cu&aacute;les son los niveles MCER&quest;</h2><p class="cuadroQCER">Los seis niveles al interno del MCER son <b>A1</b>, <b>A2</b>, <b>B1</b>, <b>B2</b>, <b>C1</b>, y <b>C2</b>. Estos seis niveles de referencia est&aacute;n ampliamente reconocidos por los est&aacute;ndares europeos para evaluar las competencias individuales en cuarenta lenguas diferentes. Cada nivel est&aacute; dividido en cuatro tipos de competencias (habilidades ling&uuml;&iacute;sticas) que describen lo que deber&iacute;a ser capaz un estudiante por lo que respecta la <b>lectura</b>, la <b>escucha</b>, la <b>conversaci&oacute;n</b> y la <b>escritura</b>.</p></div></div><br><br>' +
            '<div class="cartel11"><h2 class="justificado">Los esperamos en nuestra <b><i class="turca">"Accademia Italiana Online"</i></b> para descubrir junt@s un nuevo mundo, rico de sentimientos y emociones que llenan los corazones de tod@s!</h2></div><br><br><br>',

            '<h1 class="titulo-scc">¿Quiénes somos?</h1><p class="p1erLinea justificado">Con el objetivo de brindar un verdadero y propio método de aprendizaje, enseñanza y evaluación la <b><i class="turca">“Accademia italiana online”</i></b> nace para promover y difundir el estudio de la <i>Lengua y Cultura italiana</i>, usando de línea-guía el <b>MCER</b> (Marco común de referencia para el conocimiento de las lenguas).</p>' +
            '<p class="justificado">En noviembre del 2001, el Consejo de Europa ha aconsejado el uso del <b>MCER</b> para configurar sistemas de convalidación de las competencias lingüísticas. Para satisfacer las solicitudes de nuestros estudiantes hemos configurado diversos cursos según el grado de conocimiento y la edad.</p>' +
            '<p class="justificado">Nuestra experiencia académica comienza a formarse entorno al 2005, haciendo solo clases individuales a través de la plataforma <b>“Skipe”</b>. Fueron las primeras clases remotas hechas a distancia a alumnos solos. Veinte años más tarde, con el pasar del tiempo y la evolución de la tecnología se crea la nueva plataforma <b>“Zoom”</b> usada para reuniones virtuales, super recomendable para clases grupales, gracias a la propia herramienta “Breakup-rooms”. Por este motivo nuestra <b><i class="turca">“Accademia italiana online”</i></b> ofrece sus clases a través de esta plataforma.</p>' +
            '<div class="caja-limpia">Los cursos se dividen por edades:<br><ul><li>Adultos: mayores de 18 años;</li><li>Adolescentes: de 13 a 17 años;</li><li>Niños: de 6 a 12 años, <!es una edad donde se propone a los estudiantes niños>ideal para adquirir el italiano como LS/LE (Lengua Segunda/Lengua Extranjera).</li></ul></div>' +
            '<p class="separador-justificado">Contamos con una <b class="turca">“Mega Biblioteca Virtual”</b> de libros, cuentos, materiales didácticos por nivel, carpetas de entrenamientos, sesiones de conversación por nivel, libros de historia, arte, literatura y muchos más. Disponibles para los alumnos que contarán con un usuario y contraseña para acceder a ella.</p><br>' +
            '<h1 class="titulo-scc">Metodología</h1><p class="justificado">En nuestra <b><i class="turca">“Accademia italiana online”</i></b> se adopta un enfoque humanista-afectivo en la enseñanza de lenguas pone en el centro el aprendizaje de la persona, valorando sus emociones, su personalidad y sus experiencias. Nacido este enfoque a raíz de la psicología humanista de Carl Rogers, considera al estudiante como un todo, con el objetivo de crear un clima relajado en el aula para reducir las barreras psicológicas, filtros afectivos que dificultan el aprendizaje.</p>' +
            '<p class="justificado">Nuestro enfoque va poniendo en lugar central al estudiante. La empatía será el lazo más fuerte para crear un vínculo de confianza. Un desempeño de gran compromiso y responsabilidad. A continuación los invitamos a leer nuestros objetivos primarios.</p>' +
            '<div><h3>Objetivos Generales: </h3><ul><li>Aprendizaje de la <i>Lengua e Cultura Italiana</i>;</li><li>Intercambio intercultural;</li><li>Espacio de participación y colaboración.</li></ul></div>' +

            '<h1 class="titulo-scc">Procedimientos:</h1><p class="justificado">A partir del momento que el estudiante se inscribe en un curso de italiano, comienza a participar en las lecciones virtuales. Los cursos pueden ofrecer sea lecciones grupales sea lecciones individuales. Algunos cursos se presentan regulares, otros con una frecuencia intensiva. Sin embargo, la propuesta es siempre llegar a un objetivo y alcanzar una meta.</p>' +
            '<p class="justificado">Los cursos se realizan a través de la plataforma Zoom con una duración de 120 minutos por clase. Las clases vienen grabadas con el objetivo de monitorear y mejorar la calidad de la enseñanza. Por este motivo, aquellos (estudiantes incluídos en clases grupales) que por cualquier motivo debieran entrar en las reuniones más tarde, retirarse antes o bien debieran ausentarse non perderán ningún contenido. <b><i class="turca"><u>Quedó todo registrado en la grabación que todos los participantes de los cursos</u></i></b> recibirán a través de la dirección de correo electrónico institucional.</p>' +
            '<p class="justificado">Las clases vienen monitoreadas para controlar el seguimiento de los cursos, de los cuales surgen diversos controles. En primer lugar, <b><i class="turca">Control de Asistencia</i></b> a la clase y en segundo lugar, <b><i class="turca">Control de pagos.</i></b> En el <b><i class="turca">Control de Asistencia</i></b> se verifica la participación de los estudiantes y los contenidos desarrollados, mientras que en el <b><i class="turca">Control de pagos</i></b> se cargan los recibos de las transferencias bancarias. A este punto, se solicita a los estudiantes que envien los recibos indicando el mes / la clase al cual hace referencia a nuestra casilla de correo institucional.</p>' +

            '<br><h3>Estructura organizacional</h3>' +
            '<div class="centrar"><div class="contenedor"><div class="itemTitulo1">Área</div><div class="itemTitulo2">Responsable</div><br>' +
            '<div class="itemDato1 gris1"><a href="mailto:direccion@accademiaitalianaonline.com" class="decoraLink">Dirección&nbsp;Académica:</a>&nbsp;&nbsp;</div><div class="itemDato2 gris1">&nbsp;&nbsp;<a href="mailto:direccion@accademiaitalianaonline.com" class="decoraLink">Profesora Rosana Tundis</a></div><br>' +
            '<div class="itemDato1 gris2"><a href="mailto:administracion@accademiaitalianaonline.com" class="decoraLink">Administración:</a>&nbsp;&nbsp;</div><div class="itemDato2 gris2">&nbsp;&nbsp;<a href="mailto:administracion@accademiaitalianaonline.com" class="decoraLink">Profesora Rosana Tundis</a></div><br>' +
            '<div class="itemDato1 gris1"><a href="mailto:aula@accademiaitalianaonline.com" class="decoraLink">Aula virtual:</a>&nbsp;&nbsp;</div><div class="itemDato2 gris1">&nbsp;&nbsp;<a href="mailto:aula@accademiaitalianaonline.com" class="decoraLink">Profesora Rosana Tundis</a></div><br>' +
            '<div class="itemDato1 gris2"><a href="mailto:contacto@accademiaitalianaonline.com" class="decoraLink">Marketing - Ventas:</a>&nbsp;&nbsp;</div><div class="itemDato2 gris2">&nbsp;&nbsp;<a href="mailto:contacto@accademiaitalianaonline.com" class="decoraLink">Profesora Rosana Tundis</a></div><br>' +
            '<div class="itemDato1 gris1"><a href="mailto:soporte@accademiaitalianaonline.com" class="decoraLink">Soporte&nbsp;-&nbsp; Diseño:</a>&nbsp;&nbsp;</div><div class="itemDato2 gris1">&nbsp;&nbsp;<a href="mailto:soporte@accademiaitalianaonline.com" class="decoraLink">Dario Bellon</a></div></div><small>haga click para enviar un e-mail al Área seleccionada</small></div><br>' +

            '<br><h3>Dirección Académica</h3><p class="justificado">Desde la Dirección Académica se imparten las nuevas disposiciones, se trabaja para el mejoramiento continuo de la <b><i class="turca">"Accademia italiana online"</i></b> ofreciendo cursos de alta calidad y excelencia. Además, la Dirección Académica está abierta al diálogo, escucha las necesidades y exigencias de sus alumnos. Por tal motivo, se realizan sondeos y encuestas de valoración a nuestros estudiantes para compartir sus experiencias al interno de nuestra estructura pedagógica.</p>' +
            '<br><h3>Administración</h3><p class="justificado">La Administración de la <b><i class="turca">"Accademia italiana online"</i></b> comprende el sector administrativo y el sector contable. En el área administrativa se reciben y procesan las solicitudes de los estudiantes que llegan al correo institucional. Además, nuestra administración cuenta con su propio correo electrónico, a través del cual se comunican las novedades oficiales. En el área contable se realizan diversos controles, entre ellos:<p class="justificado">' +
            '<div><ul><li>Control de asistencia a clase (presentismo);</li><li>Control de pagos de los cursos (Carga de los recibos en el sistema operativo);</li><li>Monitoreo de las grabaciones, en modo tal de regular el seguimiento de los cursos.</li></ul></div><br>' +
            '<h3>Aula virtual</h3><p class="justificado">El Aula virtual se desarrolla a través de la plataforma Zoom, donde las lecciones vienen grabadas para optimizar la calidad de la enseñanza, del aprendizaje y finalmente de la evaluación. Las reuniones se realizan en 120 minutos, para los cursos grupales o de 60 minutos para los individuales según el curso requerido.</p><br>' +
            '<h3>Informática-Diseño gráfico:</h3><p class="justificado">Nuestro colaborador el señor <b><i>Dario Bellon</i></b>, presta soporte y asistencia en el área informática. Ha contribuido sea en la creación del sito web sea en la conformación de la <b><i class="turca">“Mega Biblioteca Virtual”</i></b> a disposición para los estudiantes.</p><br><br><br>',
        cursos: '<img alt="CURSOS" width="100%" srcset="Cursos-s.jpg 300w, Cursos-m.jpg 600w, Cursos-l.jpg 1200w, Cursos-xl.jpg 2000w" sizes="70vmin"><h1 class="titulo-scc">Cursos: regulares e intensivos</h1><br>' +

            '<div class="card-titulo">&nbsp;&nbsp;Objetivo alcanzado:</div><br><div class="porta-card-txt"><span class="card-txt">He aprendido a leer e interpretar "la <i>Lengua e Cultura italiana</i>”, descubriendo modismos que usamos a diario, comidas, e infinidad de canciones de toda la vida.</span></div><br><div class="card-titulo">&nbsp;&nbsp;Valoración:</div><img src="5Estrellas.png" class="estrellas" alt="5 estrellas"><br><div class="comentA"><span class="card-txt">(Sin dudarlo, 5 estrellas.)</span><br><br></div></article><br><br><br>' +

            '<div class="card-titulo">&nbsp;&nbsp;Aporte:</div><div class="porta-card-txt"><div class="card-txt">Mi nombre es HÉCTOR, tengo 69 años, estoy jubilado pero amo estar en actividad y estudié con la Profesora Rosana Tundis durante varios meses el año pasado previo a mi viaje a Bologna para seguir perfeccionando la hermosa lengua italiana. Una preparación excelente para una experiencia maravillosa. Las clases con Rosana facilitaron mi aprendizaje lo suficiente para sentirme seguro y capaz de seguir aprendiendo.</div></div><br>' +
            '<div class="card-titulo">&nbsp;&nbsp;Objetivo alcanzado:</div><br><div class="porta-card-txt"><span class="card-txt">Valorar el aprendizaje de la gramática para asegurar fluidez en la conversación. Afianzar y desarrollar mayor conocimiento de una lengua extranjera y la cultura italiana. Facilitar la comunicación y la convivencia con mis profesores, mis compañeros, la familia que me hospedo y, en general, con todos los que pude interactuar durante mi estadía.</span></div><br><div class="card-titulo">&nbsp;&nbsp;Valoración:</div><img src="5Estrellas.png" class="estrellas" alt="5 estrellas"><br><div class="comentA"><span class="card-txt">(La preparación de las clases y su desarrollo han sido inmejorables.)</span><br><br></div></article><br><br><br>' +
            '<article class="card"><div class="card-head"><img src="Debora-2.jpg" class="card-img" alt="Debora"><div class="card-titulo">Debora:&nbsp;&nbsp;</div><br><div class="card-txt">alumna de la <b><i class="turca">“Accademia Italiana Online”</i></b> nos comparte su experiencia adquirida en el transcurso del Nivel A2:</span></div></div>' +
            '<div class="card-titulo">&nbsp;&nbsp;Aporte:</div><div class="porta-card-txt"><div class="card-txt"><p>Con mucho gusto comparto mi experiencia en la <b><i class="turca">“Accademia Italiana Online”</i></b>.</p>Es una experiencia enriquecedora y muy gratificante. Encontré una profesora profundamente dedicada, con explicaciones claras y una disponibilidad constante hacia el alumno, no solo durante la clase, sino también después de ella e incluso en situaciones de la vida cotidiana. Eso hace que el aprendizaje del italiano se sienta cercano, humano y real.</div></div><br>' +
            '<div class="card-titulo">&nbsp;&nbsp;Objetivo alcanzado:</div><br><div class="porta-card-txt"><span class="card-txt">Logré adquirir mayor confianza en el uso del idioma, ampliar mi vocabulario y comprender mejor la cultura italiana. Más allá de lo académico, estoy ganando herramientas para comunicarse con naturalidad y poder lograr la certificación B1 de italiano como herramienta de vida, ya sea para vivir en Italia o vivir la experiencia por un tiempo.</span></div><br><div class="card-titulo">&nbsp;&nbsp;Valoración:</div><img src="5Estrellas.png" class="estrellas" alt="5 estrellas"><br><div class="comentA"><span class="card-txt">(Muchísimas gracias por la dedicación y el cariño puestos en cada clase.)</span><br><br></div></article><br><br><br>' +
            '<article class="card"><div class="card-head"><img src="AvatarMujer.png" class="card-img" alt="Lucia Canaparo"><div class="card-titulo">Lucia Canaparo<br>(<small>34 años - Santiago del Estero</small>):&nbsp;&nbsp;</div><br><div class="card-txt">alumna de la <b><i class="turca">“Accademia Italiana Online”</i></b> contribuye y comparte su experiencia en el proceso de formación inicial (A1):</div></div>' +
            '<div class="card-titulo">&nbsp;&nbsp;Aporte:</div><div class="porta-card-txt"><div class="card-txt">Hace un mes que comencé a estudiar en la academia y hasta el momento mi experiencia ha sido muy positiva. Las clases son claras, dinámicas y me permiten avanzar paso a paso en el aprendizaje del idioma. Me siento motivada y cómoda con la modalidad online.</div></div><br>' +
            '<div class="card-titulo">&nbsp;&nbsp;Objetivo alcanzado:</div><br><div class="porta-card-txt"><span class="card-txt"><ul><li>Iniciar el aprendizaje del idioma italiano.</li><li>Incorporar vocabulario básico y mejorar la comprensión.</li><li>Generar el hábito de estudio y práctica diaria.</li></ul></span></div><div class="card-titulo">&nbsp;&nbsp;Valoración:</div><img src="5Estrellas.png" class="estrellas" alt="5 estrellas"><br><div class="comentA"><span class="card-txt">(5 estrellas)</span><br><br></div></article><br><br><br>' +
            '<article class="card"><div class="card-head"><img src="MariadelC65.jpg" class="card-img" alt="Maria del Carmen"><div class="card-titulo">Maria del Carmen (65 años):&nbsp;&nbsp;</div><br><div class="card-txt">alumna de la <b><i class="turca">“Accademia Italiana Online”</i></b> contribuye y comparte su experiencia en el proceso de formación inicial (A1):</div></div>' +
            '<div class="card-titulo">&nbsp;&nbsp;Aporte:</div><div class="porta-card-txt"><div class="card-txt">Estoy muy contenta de haber comenzado este curso hace tres meses. Es muy interesante con muchísimo material, actividades, lecturas, videos y audios de comprensión.</div></div><br>' +
            '<div class="card-titulo">&nbsp;&nbsp;Objetivo alcanzado:</div><br><div class="porta-card-txt"><span class="card-txt">He logrado vencer la timidez de leer ante los compañeros del grupo, preguntar y aclarar mis dudas.</span></div><br><div class="card-titulo">&nbsp;&nbsp;Valoración:</div><img src="5Estrellas.png" class="estrellas" alt="5 estrellas"><br><div class="comentA"><span class="card-txt">(Cinco estrellas para el curso y la excelente profesora Rosana.)</span><br><br></div></article><br><br><br>' +

it: {
    menu: ["Home", "Chi Siamo", "Corsi", "Bacheca", "Casi di Successo", "Contattaci", "Area Studenti"],
    /*       menu: ["Home", "Corsi", "Casi di Successo", "Chi Siamo", "Contattaci", "Area Studenti"],*/
    contenido: {
        inicio: '<div class="slider"><div class="slides"><div class="slide"><img alt="banner Italia 1" srcset="Italia-1-s.jpg 300w, Italia-1-m.jpg 600w, Italia-1-l.jpg 1200w, Italia-1-xl.jpg 2000w" sizes="70vmin"></div><div class="slide"><img alt="banner Italia 2" srcset="Italia-2-s.jpg 300w, Italia-2-m.jpg 600w, Italia-2-l.jpg 1200w, Italia-2-xl.jpg 2000w" sizes="70vmin"></div><div class="slide"><img alt="banner Italia 3" srcset="Italia-3-s.jpg 300w, Italia-3-m.jpg 600w, Italia-3-l.jpg 1200w, Italia-3-xl.jpg 2000w" sizes="70vmin"></div><div class="slide"><img alt="banner Italia 4" srcset="Italia-4-s.jpg 300w, Italia-4-m.jpg 600w, Italia-4-l.jpg 1200w, Italia-4-xl.jpg 2000w" sizes="70vmin"></div><div class="slide"><img alt="banner Italia 5" srcset="Italia-5-s.jpg 300w, Italia-5-m.jpg 600w, Italia-5-l.jpg 1200w, Italia-5-xl.jpg 2000w" sizes="70vmin"></div><div class="slide"><img alt="banner Italia 6" srcset="Italia-6-s.jpg 300w, Italia-6-m.jpg 600w, Italia-6-l.jpg 1200w, Italia-6-xl.jpg 2000w" sizes="70vmin"></div></div></div>' +
            '<h1 class="titulo-scc">Benvenuti</h1><!div class="mi-imagen-QCER"><!/div>' +
            '<div class="bloque"><p class="p1erLinea">Scopri la lingua della letteratura, l’arte e la passione. Nella nostra <b><i class="turca">"Accademia Italiana Online"</i></b> ti invitiamo a immergersi nell’italiano di una forma autentica, dinamica e completamente pratica, ideale tanto per chi comincia da zero come da chi desidera migliorare il suo livello accademico.</p>' +
            '<p>Imparare l’italiano non è solo imparare una lingua, è molto altro ancora assai profondo: ci apre le porte alla storia di Roma, all’incantesima città di Firenze, alla magia di Venezia e ad una delle gastronomie più riconosciute del mondo. Il nostro approccio umanistico/affettivo della glottodidattica combina Lingua e Cultura italiane sin dal primo giorno.</p>' +
            '<p>All’interno del nostro <u class="sub-azul">Piano di studio</u> si prevedono corsi specializzati, conformati da piccoli gruppi e lezioni ideate per avanzare in modo rapido ed efficace. Inoltre, la modalità online si aggiusta meglio ai bisogni o agli obiettivi dei nostri studenti.</p>' +
            '<p>I corsi sono adatti a coloro che vogliono viaggiare, studiare in Italia o semplicemente godersi la lingua, questo è lo spazio per iniziare il vostro percorso. Vi condividiamo materiale autentico, in fine vi diamo la corretta preparazione all’accreditamento a seconda il livello richiesto per le <u class="sub-azul">Certificazioni internazionali</u> (QCER).</p></div><br>' +
            '<div class="cartel"><span style="color: aqua; max-width: 750px;"><span class="turca">&nbsp;<u>QCER:</u> Quadro comune europeo di riferimento per la conoscenza delle lingue.</span></div><br>' +
            '<div class="bloque"><p>In Europa, nella comunità dell’apprendimento della lingua, spesso ascoltiamo le persone parlare del proprio livello linguistico. Ad esempio: “parlo francese con un livello B1” o “sto frequentando un corso di lingua inglese, sono in una classe di livello A2 di grammatica e conversazione”.</p></div><br>' +
            '<div class="centra-container"><div class="container"><!div id="cQCER" class="mi-imagen-QCER"><!/div><img id="cQCER" src="CQpc-it.jpg" alt="Quadro QCER" width=60vw><div class="diezPX"></div><h2 class="tituloQCER">Cosa significa B1 o A2&quest;</h2><p class="cuadroQCER">Questi titoli sono i livelli di competenza linguistica nel sistema del <b>Quadro comune europeo di riferimento per la conoscenza delle lingue</b>, abbreviato in italiano <b>QCER</b>, e sono usati dagli studenti per misurare il proprio livello di conoscenza di una determinata lingua. QCER è una linea guida che viene utilizzata per descrivere i traguardi raggiunti da chi studia una lingua straniera in tutta Europa e sempre più in altri Paesi.</p>' +
            '<h2 class="tituloQCER">Quali sono i vari livelli QCER&quest;</h2><p class="cuadroQCER">I sei livelli all’interno di QCER sono <b>A1</b>, <b>A2</b>, <b>B1</b>, <b>B2</b>, <b>C1</b>, y <b>C2</b>. Questi sei livelli di riferimento sono ampiamente riconosciuti dagli standard europei per valutare le competenze individuali in quaranta lingue differenti. Ogni livello è diviso in quattro tipi di competenze (abilità linguistiche) che descrivono cosa uno studente dovrebbe essere in grado di fare per quanto riguarda la <b>lettura</b>, l’<b>ascolto</b>, la <b>conversazione</b> e la <b>scrittura</b>.</p></div></div><br><br>' +
            '<div class="cartel justificado"><h2>Vi aspettiamo nella nostra <i class="turca">"Accademia Italiana Online"</i> per scoprire insieme un nuovo mondo, ricco di sentimenti ed emozioni che avvolgono i cuori di tutti quanti!</h2></div><br><br><br>',
        quienes: '<img alt="Chi Siamo" width="100%" srcset="Chi-Siamo-s.jpg 300w, Chi-Siamo-m.jpg 600w, Chi-Siamo-l.jpg 1200w, Chi-Siamo-xl.jpg 2000w" sizes="70vmin">' +
            '<h1 class="titulo-scc">Chi Siamo</h1><p class="p1erLinea justificado">Con lo scopo di fornire un vero e proprio metodo di apprendimento, insegnamento e valutazione <b><i class="turca">“L’Accademia italiana online”</i></b> nasce per promuovere e diffondere lo studio della <i>Lingua e Cultura italiane</i>, usando di lineaguida il <strong>QCER</strong> (Quadro comune europeo di riferimento per la conoscenza delle lingue).</p>' +
            '<p class="justificado">Nel novembre del 2001, il Consiglio d’Europa ha consigliato l’utilizzo del QCER per impostare sistemi di convalidazione delle competenze linguistiche. Per soddisfare le richieste degli studenti abbiamo strutturato diversi corsi in base al livello di conoscenza e l’età.</p>' +
            '<p class="justificado">La nostra esperienza accademica comincia a formarsi intorno al 2005, offrendo solo lezioni individuali attraverso la piattaforma <b>“Skipe”</b>. Sono state le prime lezioni remote impartite a distanza ai singoli alunni. Venta’anni dopo, col passare del tempo e l’evoluzione della tecnologia, si crea la nuova piattaforma <b>“Zoom”</b> usata per riunioni virtuali e super consigliata per lezioni gruppali, grazie al suo strumento “Breakout-rooms”. Per questo motivo, la nostra <b><i class="turca">“Accademia italiana online”</i></b> offre le sue lezioni attraverso questa piattaforma.</p>' +
            '<div class="caja-limpia">I corsi sono suddivisi per età:<br><ul class="ceroPad"><li>Adulti: Maggiori di 18 anni;</li><li>Adolescenti: dai 13 ai 17 anni;</li><li>Bambini: dai 6 ai 12 anni, un’età in cui si propone di acquisire l’italiano come L2/LS (Lingua Seconda/Lingua Straniera).</li></ul></div>' +
            '<p class="separador-justificado">Disponiamo di una <b class="turca">“Mega Biblioteca Virtuale”</b> di libri, racconti, materiali didattici divisi per corso, cartelle di allenamento, sessioni di conversazione per livello, libri di storia, arte, letteratura e molto altro ancora.  Questi sono a disposizione degli studenti, avranno un account con nome di utente e una password per accedere alla <b class="turca">“Mega Biblioteca Virtuale”</b> della nostra accademia.</p><br>' +
            '<h1 class="titulo-scc">Metodologia</h1><p class="justificado">Nella nostra <b><i class="turca">“Accademia Italia Online”</i></b> si adotta un <u>Approccio Umanistico-Affettivo della Glottodidattica</u>, che pone al centro l’apprendimento della persona, valorizzando le sue emozioni, la sua personalità e le sue esperienze. Nato dalla psicologia umanistica di Carl Rogers, considera lo studente nella sua totalità, con l’obiettivo di creare un clima rilassato in classe per ridurre le barriere psicologiche e i filtri affettivi che ostacolano l’apprendimento. Il nostro approccio mette lo studente al centro. L’empatia sarà il legame più forte per creare un vincolo di fiducia. Un lavoro di grande impegno e responsabilità. Di seguito vi invitiamo a leggere i nostri obiettivi primari.</p>' +
            '<div><h3>Obiettivi Generali:</h3><ul><li>Acquisizione della </i>Lingua e Cultura Italiane</i>;</li><li>Intercambio interculturale;</li><li>Spazio di partecipazione e collaborazione.</li></ul></div>' +
            '<div><h3>Obiettivi Specifici:</h3><ul><li>Acquisizione dei contenuti grammaticali, lessicali e fonetici;</li><li>Sviluppo delle attività cognitive;</li><li>Sviluppo delle abilità di comprensione della lettura;</li><li>Sviluppo delle abilità di produzione scritta;</li><li>Espressione orale - Drammatizzazione.</li></ul></div><br>' +
            '<h1 class="titulo-scc">Procedure:</h1><p class="justificado">Dal momento in cui che lo studente si iscrive ad un corso di italiano, comincia a partecipare alle lezioni virtuali. I corsi possono offrire sia lezioni gruppali sia lezioni individuali. Alcuni corsi si presentano regolari, altri di frequenza intensiva. Tuttavia, la proposta è sempre quella di raggiungere un obiettivo e tagliare un traguardo.</p>' +
            '<p class="justificado">I corsi si realizzano tramite la piattaforma ”Zoom” con una durata di 120 minuti ogni lezione. Le lezioni vengono registrate con l’obiettivo di monitorare e migliorare la qualità dell’istruzione. Per questo motivo, coloro (studenti compresi nelle lezioni gruppali) che per qualsiasi motivo dovessero entrare nelle riunioni più tardi, andare via prima oppure dovessero assentarsi non perderanno alcun contenuto. Rimane tutto registrato nella registrazione che tutti i partecipanti ai corsi riceveranno tramite l’indirizzo di posta elettronica istituzionale.</p>' +
            '<p class="justificado">Le registrazioni vengono monitorate per controllare l’andamento dei corsi, da cui scaturiscono diversi controlli. In primo luogo, <b><i class="turca">Controllo di Appello</i></b> alla classe e in secondo luogo, <b><i class="turca">Controllo dei pagamenti</i></b>. Nel <b><i class="turca">Controllo di Appello</i></b> si verifica la partecipazione degli studenti e i contenuti svolti, mentre che nel <b><i class="turca">Controllo dei pagamenti</i></b> si caricano le ricevute dei bonifici bancari. A questo punto, si richiede ad ogni studente di inviare le ricevute indicando il mese/la lezione a cui fa riferimento, alla nostro casella di posta istituzionale.</p>' +
            '<br><h3>Struttura organizzazionale</h3>' +

            '<div class="centrar"><div class="contenedor"><div class="itemTitulo1">Area</div><div class="itemTitulo2">Risponsabile</div><br>' +
            '<div class="itemDato1 gris1"><a href="mailto:direccion@accademiaitalianaonline.com" class="decoraLink">Direzione&nbsp;Accademica:</a>&nbsp;&nbsp;</div><div class="itemDato2 gris1">&nbsp;&nbsp;<a href="mailto:direccion@accademiaitalianaonline.com" class="decoraLink">Prof.ssa Rosana Tundis</a></div><br>' +
            '<div class="itemDato1 gris2"><a href="mailto:administracion@accademiaitalianaonline.com" class="decoraLink">Amministrazione:</a>&nbsp;&nbsp;</div><div class="itemDato2 gris2">&nbsp;&nbsp;<a href="mailto:administracion@accademiaitalianaonline.com" class="decoraLink">Prof.ssa Rosana Tundis</a></div><br>' +
            '<div class="itemDato1 gris1"><a href="mailto:aula@accademiaitalianaonline.com" class="decoraLink">Aula virtuale:</a>&nbsp;&nbsp;</div><div class="itemDato2 gris1">&nbsp;&nbsp;<a href="mailto:aula@accademiaitalianaonline.com" class="decoraLink">Prof.ssa Rosana Tundis</a></div><br>' +
            '<div class="itemDato1 gris2"><a href="mailto:contacto@accademiaitalianaonline.com" class="decoraLink">Marketing - Vendite:</a>&nbsp;&nbsp;</div><div class="itemDato2 gris2">&nbsp;&nbsp;<a href="mailto:contacto@accademiaitalianaonline.com" class="decoraLink">Prof.ssa Rosana Tundis</a></div><br>' +
            '<div class="itemDato1 gris1"><a href="mailto:soporte@accademiaitalianaonline.com" class="decoraLink">Supporto&nbsp;-&nbsp;Progettazione:</a>&nbsp;&nbsp;</div><div class="itemDato2 gris1">&nbsp;&nbsp;<a href="mailto:soporte@accademiaitalianaonline.com" class="decoraLink">Dario Bellon</a></div></div><small>tocca per inviare un e-mail all’Area richiesta</small></div><br>' +

            '<br><h3>Direzione Accademica</h3><p class="justificado">Dalla Direzione Accademica vengono importartite le nuove disposizioni, si lavora per il miglioramento continuo <b><i class="turca">"dell’Accademia Italiana Online"</i></b> offrendo corsi di alta qualità ed eccellenza. Inoltre, la Direzione Accademica è aperta al dialogo, ascolta i bisogni ed le esigenze dei suoi alunni. Per tale motivo, vengono effettuati sondaggi e inchieste di valutazione rivolti ai nostri studenti per condividere le loro esperienze all’interno della nostra struttura pedagogica.</p>' +
            '<br><h3>Amministrazione</h3><p class="justificado">L’Amministrazione <b><i class="turca">"dell’Accademia Italiana Online"</i></b> comprende il settore amministrativo e il settore contabile. Nell’area amministrativa si ricevono e si processano le richieste degli studenti che arrivano alla posta istituzionale. Inoltre, la nostra amministrazione dispone una propria casella e-mail, attraverso la quale vengono comunicate le novità ufficiali. Nell’area contabile vengono effettuati diversi controlli, tra cui:<p class="justificado">' +
            '<div><ul><li>Controllo di presenza alle lezioni (Appello della classe);</li><li>Controllo dei pagamenti dei corsi (Caricamento della ricevute nel sistema operativo);</li><li>Monitoraggio delle registrazioni, in modo tale di regolare l’andamento dei corsi.</li></ul></div><br>' +

const secciones = ["inicio", "quienes", "cursos", "cartel", "casos", "contacto", "area"];

let idioma = localStorage.getItem("idioma") || "es";
let usuario = localStorage.getItem("usuario");


/* ===== CAMBIA LA MAGEN DEL MENU ===== */
const cbox = document.getElementById('menuCelu');   /* checkbox */
const imagen = document.getElementById("imgchange");
imagen.addEventListener("click", () => {
    imagen.src = cbox.checked
    ? "MenuP.png"
    : "MenuX.png";
});

/*soporte para los botones Atrás/Adelante del navegador*/
window.addEventListener("popstate", () => {
    const hash = window.location.hash.replace("#", "");
    if (secciones.includes(hash)) {
        cargar(hash);
    }
});

/* esto es para que no recargue la pag. al cambiar de seccion */
window.addEventListener("load", () => {
    const hash = window.location.hash.replace("#", "");
    if (secciones.includes(hash)) {
        cargar(hash);
    } else {
        cargar("inicio");
    }
});


/* ===== FUNCTIONS ===== */
function renderMenuC() {
    const ul = document.getElementById("menu-portrait");
    ul.innerHTML = "";
/* "textos" idiomas(es-it) / "idioma" idioma actual / ".menu" array de ITems ["Inicio", "Cursos", "ETC"] / "txt" ITem / "i" índice. */
    textos[idioma].menu.forEach((txt, i) => {
        if (secciones[i] === "area" && !usuario) return;
            /* secciones = inicio, cursos, casos, etc */
        const li = document.createElement("li");
        li.textContent = txt;
        li.classList.add("idm");
        li.addEventListener("click", () => {
            // cargar contenido
            cargar(secciones[i]);
            // cambiar URL sin recargar
            history.pushState(
                {},
                "",
                "#" + secciones[i]
            );
            // subir al topo de la Pag.
            window.scrollTo({ top: 0, behavior: "smooth" }); // behavior opcional
            // cerrar menú hamburguesa
            cbox.checked = false;
            // cambiar imagen hamburguesa
            imagen.src = "MenuP.png";
        });
        ul.appendChild(li);
        /*cuaCua();*/
    });
}

function cargar(sec) {
    if (sec === "area" && !usuario) {
        abrirLogin();
        return;
    }
    document.getElementById("contenido").innerHTML = textos[idioma].contenido[sec];
    /*imagen.style.src = "MenuP.png";*/
    /*imagen.src = "MenuP.png";
    cbox.checked = false;*/
}

function cambiarIdioma(l) {
    idioma = l;
    localStorage.setItem("idioma", idioma);
    renderMenu();
    cargar("inicio");
}

function abrirLogin() {
    document.getElementById("loginModal").classList.add("show");
}

function cerrarLogin(e) {
    if (!e || e.target.id === "loginModal") {
        document.getElementById("loginModal").classList.remove("show");
    }
}

function login() {
    const u = user.value;
    const p = pass.value;

    if (u === "alumno" && p === "1234") {
        localStorage.setItem("usuario", u);
        usuario = u;
        cerrarLogin();
        init();
        cargar("area");
    } else {
        error.innerText = "Credenciales incorrectas";
    }
}

function logout() {
    localStorage.removeItem("usuario");
    usuario = null;
    init();
    cargar("inicio");
}

function init() {
    document.getElementById("langSelect").value = idioma;
    document.getElementById("authBtn").innerHTML = usuario
        ? `<div class="logout-btn" onclick="logout()">${textos[idioma].logout}</div>`
        : `<div class="login-btn" onclick="abrirLogin()">${textos[idioma].login}</div>`;
    renderMenu();
}

function vBanner() {
    const ul = document.getElementById("menu");
    ul.innerHTML = "";
    textos[idioma].menu.forEach((txt,i)=>{
        if (secciones[i] === "area" && !usuario) return;
        ul.innerHTML += `<li onclick="cargar('${secciones[i]}')">${txt}</li>`;
    });
}

/* ===== INIT ===== */
init();
cargar("inicio");
